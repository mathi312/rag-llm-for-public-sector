services:
  ollama:
    ports:
      - "11434:11434"

  rag-app:
    # Development settings with file sync
    develop:
      watch:
        # Sync all Python files - Streamlit auto-reloads
        - action: sync
          path: .
          target: /app
          ignore:
            - .git
            - __pycache__
            - .pytest_cache
    ports:
      - "8501:8501"

  pocketbase:
    ports:
      - "8080:8080"

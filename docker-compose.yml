version: '3.8'

services:
  # Ollama service (the LLM backend)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit RAG app
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    # Development settings with file sync
    develop:
      watch:
        # Sync all Python files - Streamlit auto-reloads
        - action: sync
          path: .
          target: /app
          ignore:
            - .git
            - __pycache__
            - .pytest_cache
    ports:
      - "8501:8501"
    volumes:
      # Persist the vector database so restart doesn't lose data
      - ./faiss_index:/app/faiss_index
      # Mount local 'data' folder for static file ingestion
      - ./data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # Mailhog service for capturing outgoing emails
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  ollama_data:

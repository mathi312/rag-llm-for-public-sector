stages:
  - test

pytest:
  stage: test
  image: python:3.12-slim
  variables:
    PYTHONPATH: "${PYTHONPATH}:."
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng libgl1 libglib2.0-0
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest